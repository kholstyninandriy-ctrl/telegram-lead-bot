services:
  # AI-Рецепціоніст (чат-віджет + Vapi webhook + бронювання).
  # Необов'язкові змінні (ANTHROPIC_API_KEY, PUBLIC_URL, TELEGRAM_BOT_TOKEN, OWNER_CHAT_ID,
  # CALCOM_*, GOOGLE_*) додаються пізніше: сервіс → Environment.
  - type: web
    name: ai-receptionist
    runtime: python
    plan: free
    rootDir: receptionist
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: BUSINESS_TIMEZONE
        value: Europe/Lisbon
      - key: DEFAULT_PHONE_REGION
        value: PT
      - key: OPENAI_API_KEY
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
      - key: VAPI_SECRET
        generateValue: true
